# Cloudflare Tunnel — example config for Family Edu Engine Room
# Copy to ~/.cloudflared/config.yml (or a local path) and fill in values.
# NEVER commit a real credentials file or tunnel token.

tunnel: YOUR_TUNNEL_ID
credentials-file: /home/YOUR_USER/.cloudflared/YOUR_TUNNEL_ID.json

ingress:
  # Public hostname → local FastAPI Engine Room
  - hostname: api-local.yourdomain.com
    service: http://127.0.0.1:8000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false

  # Catch-all (required)
  - service: http_status:404
