name: Deploy

# Deploys production build to a VPS over SSH when main is updated,
# or when run manually from the Actions tab.
#
# Required GitHub Secrets:
#   DEPLOY_HOST          e.g. 203.0.113.10 or edu.example.com
#   DEPLOY_USER          e.g. deploy
#   DEPLOY_SSH_KEY       private key (full PEM)
#   DEPLOY_PATH          e.g. /var/www/family-edu-hub
# Optional:
#   DEPLOY_PORT          SSH port (default 22)
#   DEPLOY_HEALTH_URL    e.g. https://edu.example.com/api/health
#
# On the server, expect:
#   - Node 22+
#   - process manager (pm2 recommended)
#   - .env already present at DEPLOY_PATH/.env (never uploaded by CI)
#   - `pm2 start dist/server.cjs --name family-edu-hub` once initially

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server.ts"
      - "server-*.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        env:
          NODE_ENV: production
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'Family Edu Hub' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
          VITE_ENGINE_ROOM_URL: ${{ vars.VITE_ENGINE_ROOM_URL || '' }}
          VITE_POLL_INTERVAL_MS: ${{ vars.VITE_POLL_INTERVAL_MS || '15000' }}
          VITE_HEALTH_POLL_MS: ${{ vars.VITE_HEALTH_POLL_MS || '10000' }}
          VITE_ENABLE_ANALYTICS: ${{ vars.VITE_ENABLE_ANALYTICS || 'true' }}
        run: npm run build

      - name: Pack release
        run: |
          mkdir -p release
          cp -r dist release/
          cp package.json release/
          if [ -f package-lock.json ]; then cp package-lock.json release/; fi
          tar -czf release.tgz -C release .

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tgz
          retention-days: 14

  deploy:
    name: SSH deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    if: ${
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    }

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_HOST / DEPLOY_SSH_KEY not configured — skip deploy."
            echo "Add GitHub Secrets to enable SSH deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH_READY=1" >> $GITHUB_ENV

      - name: Upload & restart
        if: env.SSH_READY == '1'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT}" release.tgz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/family-edu-release.tgz"

          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s << EOF
          set -euo pipefail
          APP="${DEPLOY_PATH}"
          mkdir -p "\$APP"
          # Keep .env and data/ across deploys
          tar -xzf /tmp/family-edu-release.tgz -C "\$APP"
          cd "\$APP"
          if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi
          if command -v pm2 >/dev/null 2>&1; then
            pm2 restart family-edu-hub || pm2 start dist/server.cjs --name family-edu-hub
            pm2 save || true
          else
            echo "pm2 not found — start dist/server.cjs manually"
          fi
          rm -f /tmp/family-edu-release.tgz
          EOF

      - name: Health check
        if: env.SSH_READY == '1'
        env:
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          if [ -z "$DEPLOY_HEALTH_URL" ]; then
            echo "No DEPLOY_HEALTH_URL secret — skipping health check"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if curl -fsS "$DEPLOY_HEALTH_URL" | grep -q ok; then
              echo "Health OK"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed"
          exit 1
