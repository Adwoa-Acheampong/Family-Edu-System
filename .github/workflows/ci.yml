name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-node:
    name: Lint & build (Node + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint
        continue-on-error: true

      - name: Production build
        env:
          NODE_ENV: production
          # Public Vite placeholders — real URLs set at deploy host / secrets
          VITE_APP_NAME: Family Edu Hub
          VITE_API_BASE_URL: ""
          VITE_ENGINE_ROOM_URL: ""
          VITE_POLL_INTERVAL_MS: "15000"
          VITE_HEALTH_POLL_MS: "10000"
          VITE_ENABLE_ANALYTICS: "true"
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: |
            dist/
          retention-days: 7

  engine-room:
    name: Engine Room (Python syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine-room

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile check
        run: |
          python -m compileall -q .
